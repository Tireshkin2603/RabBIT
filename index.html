<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="rabbit.svg">
    <title>RabBIT Sprite Studio v1.0</title>
    <style>
        body {
            background: #0d0d13;
            color: #00ffcc;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            gap: 12px;
        }
        .ui-icon {
            display: inline-block;
            width: 36px;
            height: 36px;
            background-image: url('icons1%20(1).svg');
            background-size: 406px 151px;
            background-repeat: no-repeat;
            vertical-align: middle;
            cursor: pointer;
            transform: scale(0.75);
            transform-origin: left center;
            margin-top: 5px;
        }
        .ico-ui-flag       { background-position: 0px 0px; }
        .ico-ui-stop       { background-position: -36px 0px; }
        .ico-ui-fullscreen { background-position: -72px 0px; }
        .ico-ui-spritebtn  { background-position: -108px 0px; }
        .ico-ui-bgbtn      { background-position: -144px 0px; }

        .cat-icon {
            display: block;
            width: 36px;
            height: 36px;
            background-image: url('icons1%20(1).svg');
            background-size: 406px 151px;
            background-repeat: no-repeat;
            cursor: pointer;
            transition: transform 0.1s;
            image-rendering: pixelated;
            overflow: hidden;
        }
        .cat-icon:hover { transform: scale(1.1); }
        
        .ico-cat-motion   { background-position: -226px 0px; }
        .ico-cat-events   { background-position: -262px 0px; }
        .ico-cat-control  { background-position: -298px 0px; }
        .ico-cat-ui       { background-position: -334px 0px; }
        .ico-cat-sound    { background-position: -370px 0px; }
        .ico-cat-operators{ background-position: -0px -44px; }
        .ico-cat-sensing  { background-position: -38px -44px; }
        .ico-cat-variables{ background-position: -74px -44px; }
        .ico-cat-cheats   { background-position: -110px -42px; }
        .ico-cat-myblocks { background-position: -146px -44px; }

        #types-sidebar {
            width: 52px;
            background: #14141f;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px 5px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            height: 100%;
        }
        #blocks-sidebar {
            width: 280px;
            height: 100%;
            background: #14141f;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        #blocks-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #center-sector {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
            height: 100%;
        }
        #scene-zone {
            background: #050508;
            border: 2px solid #ff007f;
            border-radius: 8px;
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.15);
            padding: 5px;
        }
        #scene-top-bar {
            height: 42px;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            box-sizing: border-box;
        }
        #scene-left-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #fps-badge {
            color: #00ff00;
            font-family: monospace;
            font-weight: bold;
            font-size: 12px;
        }
        #canvas-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            border-radius: 4px;
            margin-top: 5px;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        #workspace-zone {
            height: 280px;
            background: #14141f;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            overflow: auto;
        }
        #right-sidebar {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
            height: 100%;
        }
        #sprites-panel {
            flex: 1;
            background: #14141f;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        #bg-panel {
            height: 180px;
            background: #14141f;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #bg-action-buttons {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn {
            border-image: url('block-move.svg') 10 120 10 90 fill stretch;
            border-image-width: 10px 120px 10px 90px;
            color: #ffffff;
            border-style: solid;
            width: fit-content;
            min-width: 212px;
            white-space: nowrap;
            display: inline-flex;
            height: 46px;
            padding: 0 55px 4px 10px;
            align-items: center;
            justify-content: flex-start;
            font-weight: bold;
            font-family: Arial, sans-serif;
            font-size: 13px;
            box-sizing: border-box;
        }
        .btn-input {
            background: #ffffff;
            color: #000000;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 35px;
            height: 18px;
            text-align: center;
            font-weight: bold;
            font-family: Arial, sans-serif;
            font-size: 11px;
            outline: none;
            position: relative;
            vertical-align: middle;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="types-sidebar">
        <div class="cat-icon ico-cat-motion" title="Движение"></div>
        <div class="cat-icon ico-cat-events" title="События"></div>
        <div class="cat-icon ico-cat-control" title="Управление"></div>
        <div class="cat-icon ico-cat-ui" title="Интерфейс"></div>
        <div class="cat-icon ico-cat-sound" title="Звуки"></div>
        <div class="cat-icon ico-cat-operators" title="Операторы"></div>
        <div class="cat-icon ico-cat-sensing" title="Сенсоры"></div>
        <div class="cat-icon ico-cat-variables" title="Переменные"></div>
        <div class="cat-icon ico-cat-cheats" title="Чит код"></div>
        <div class="cat-icon ico-cat-myblocks" title="Мои блоки"></div>
    </div>

    <div id="blocks-sidebar">
        <div id="blocks-list">
            <div class="btn">Идти <input type="text" class="btn-input" value="15" style="margin: 0 5px;"> шагов</div>
            <div class="btn">Перейти в x: <input type="text" class="btn-input" value="0" style="margin-left: 5px; margin-right: 10px;"> y: <input type="text" class="btn-input" value="0" style="margin-left: 5px;"></div>
            <div class="btn">Изменить x на <input type="text" class="btn-input" value="15" style="margin-left: 8px;"></div>
            <div class="btn">Задать x в <input type="text" class="btn-input" value="15" style="margin-left: 8px;"></div>
            <div class="btn">Изменить y на <input type="text" class="btn-input" value="15" style="margin-left: 8px;"></div>
            <div class="btn">Задать y в <input type="text" class="btn-input" value="15" style="margin-left: 8px;"></div>
        </div>
    </div>

    <div id="center-sector">
        <div id="scene-zone">
            <div id="scene-top-bar">
                <div id="scene-left-controls">
                    <span class="ui-icon ico-ui-flag" title="Старт"></span>
                    <span class="ui-icon ico-ui-stop" title="Стоп"></span>
                    <span id="fps-badge">FPS: <span id="fps-val">60</span></span>
                </div>
                <span class="ui-icon ico-ui-fullscreen" title="На весь экран"></span>
            </div>
            <div id="canvas-wrapper">
                <canvas id="screen"></canvas>
            </div>
        </div>

        <div id="workspace-zone"></div>
    </div>

    <div id="right-sidebar">
        <div id="sprites-panel"></div>
        <div id="bg-panel">
            <div id="bg-action-buttons">
                <span class="ui-icon ico-ui-spritebtn" title="Выбрать спрайт"></span>
                <span class="ui-icon ico-ui-bgbtn" title="Выбрать фон"></span>
            </div>
        </div>
    </div>

<script>
let lastTime = performance.now();
let fps = 0;

let rabbitImg = new Image();
rabbitImg.src = "rabbit.svg";

function studioLoop() {
    let canvas = document.getElementById("screen");
    if (canvas) {
        let ctx = canvas.getContext("2d");
        
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.drawImage(rabbitImg, canvas.width / 2 - 50, canvas.height / 2 - 75, 100, 150);

        let now = performance.now();
        let duration = now - lastTime;
        if (duration > 0) {
            fps = Math.round(1000 / duration);
        }
        lastTime = now;
        
        let fpsDisplay = document.getElementById("fps-val");
        if (fpsDisplay) fpsDisplay.innerText = fps;
    }
    requestAnimationFrame(studioLoop);
}

window.onload = function() {
    studioLoop();
};
</script>
</body>
</html>
