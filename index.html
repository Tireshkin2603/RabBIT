Привет от Тирешкина!RabBIT на 1000 FPS!
<canvas id="screen" width="400" height="400" style="background:#000; display:block; margin:auto; border:2px solid #ff007f;"></canvas>
<script>
  function parser(line) {
    let parts = line.replace(/[{}]/g, "").split(".");
    if (parts.length === 3)
      return " Режим 2D запущен! Предел: ЙААА!";
    if (parts.length === 4) return " Режим 3D запущен!";
    return " Объект заспавнен!";
  }
 let cubeY = 50;
  let speedY = 0;
  let graviti = 0.5;
   function gameLoop() {
     let canvas = document.getElementById("screen")
     if (canvas) {
       let ctx = canvas.getContext("2d");
       ctx.clearRect(0, 0, canvas.width, canvas.height);

       speedY += graviti;
       cubeY += speedY;

       if (cubeY > 300) {
         cubeY = 300;
         speedY = 0;
       }
       ctx.fillStyle = "#ff007f";
       ctx.fillRect(150, cubeY, 100, 100);
     }
     requestAnimationFrame(gameLoop);
   }
   window.onload = function() { 
   gameLoop();
    console.log(parser("{i.ЯЯЯЯ.ЯЯЯЯ}"));
 };
</script>
