Привет от Тирешкина!RabBIT на 1000 FPS!
<canvas id="screen" width="400" height="400" style="background:#000; display:block; margin:auto; border:2px solid #ff007f;"></canvas>
<script>
  function parser(line) {
    let parts = line.replace(/[{}]/g, "").split(".");
    if (parts.length === 3)
      return " Режим 2D запущен! Предел: ЙААА!";
    if (parts.length === 4) return " Режим 3D запущен!";
    return " Объект заспавнен!";
  }
  let cubeX = 150;
 let cubeY = 50;
  let speedY = 0;
  let graviti = 0.5;
  let isLeft = false
  let isRight = false
  let fps = 0;
  let lastTime = performance.now();
  window.addEventListener("keydown",function(e) {
    if (e.key === "ArrowLeft") isLeft = true;
    if (e.key === "ArrowRight") isRight = true;
  });
  window.addEventListener("keyup",function(e) {
    if (e.key === "ArrowLeft") isLeft = false;
    if (e.key === "ArrowRight") isRight = false;
  });
   function gameLoop() {
     if (isLeft) cubeX -= 4;
     if (isRight) cubeX += 4;
     let canvas = document.getElementById("screen")
     if (canvas) {
       let ctx = canvas.getContext("2d");
       ctx.clearRect(0, 0, canvas.width, canvas.height);

       speedY += graviti;
       cubeY += speedY;

       if (cubeY > 300) {
         cubeY = 300;
         speedY = 0;
       }
       ctx.fillStyle = "#ff007f";
       ctx.fillRect(cubeX, cubeY, 100, 100);
     
     let now = performance.now();
       let duration = now - lastTime;
       if (duration > 0) {
     fps = Math.round(1000 / duration);
       }
       lastTime = now;
     ctx.fillStyle = "#00ffcc";
     ctx.font = "16px Arial";
     ctx.fillText("FPS: " + fps, 10, 25);
     }
   }
   window.onload = function() { 
    setInterval(gameLoop, 2.7);
    console.log(parser("{i.ЯЯЯЯ.ЯЯЯЯ}"));
 };
</script>
